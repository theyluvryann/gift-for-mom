<!DOCTYPE html>
<html lang="en">
<head>

<body>

<div id="app">

  <div class="page active" id="page1">

  <!-- PAGE 2: INTRO -->

    <button onclick="nextPage(3)">Continue ❤️</button>

  <!-- PAGE 3: APPRECIATION -->
  <div class="page" id="page3">
    <h1>My Appreciation for youu 💕</h1>
    <p id="type1"></p>
    <button onclick="nextPage(4)">Next ➡️</button>
  </div>

  <!-- PAGE 4: THANK YOU -->
  <div class="page" id="page4">
    <h1>Thank you for everythingg ❤️</h1>
    <p id="type2"></p>
    <button onclick="nextPage(5)">Final 💝</button>
  </div>

  <!-- PAGE 5: FINAL -->
  <div class="page" id="page5">
    <div id="heart">❤️</div>
    <div id="finalText"></div>
  </div>

</div>

<script src="script.js"></script>

</html>
